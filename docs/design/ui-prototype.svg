<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Proxy Switch desktop UI prototype</title>
  <desc id="desc">Dark desktop tool shell with fixed navigation, current route summary, provider list and status bar.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="#0E1519"/>
  <rect x="0" y="0" width="1200" height="52" fill="#141E23"/>
  <rect x="215" y="0" width="1" height="780" fill="#26363A"/>
  <rect x="0" y="51" width="1200" height="1" fill="#26363A"/>

  <!-- top bar -->
  <circle cx="25" cy="26" r="5" fill="#62E6C2"/>
  <text x="40" y="32" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">Proxy Switch</text>
  <text x="40" y="47" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="9">LOCAL ROUTING TOOL</text>
  <text x="760" y="31" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="12">当前档案</text>
  <rect x="824" y="12" width="128" height="28" rx="6" fill="#1A272B" stroke="#3A5153"/>
  <text x="837" y="31" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="12">工作</text>
  <path d="m934 23 4 4 4-4" fill="none" stroke="#62E6C2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="970" y="12" width="34" height="28" rx="6" fill="#1A272B" stroke="#26363A"/>
  <path d="M991 20a7 7 0 1 0 1 8" fill="none" stroke="#A4B6B5" stroke-width="1.7" stroke-linecap="round"/>
  <path d="m990 18 3 2-3 2" fill="none" stroke="#A4B6B5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1031" cy="25" r="5" fill="#62E6C2"/>
  <text x="1043" y="30" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="11">Codex 运行中</text>
  <rect x="1115" y="12" width="1" height="28" fill="#26363A"/>
  <circle cx="1131" cy="25" r="1.5" fill="#6D8181"/>
  <circle cx="1137" cy="25" r="1.5" fill="#6D8181"/>
  <circle cx="1143" cy="25" r="1.5" fill="#6D8181"/>

  <!-- left navigation -->
  <rect x="0" y="52" width="215" height="728" fill="#141E23"/>
  <rect x="18" y="75" width="30" height="30" rx="8" fill="#62E6C2"/>
  <text x="27" y="96" fill="#0E1519" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">CP</text>
  <text x="60" y="88" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">Codex Hub</text>
  <text x="60" y="103" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="10">本地 Provider 管理</text>
  <text x="20" y="150" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">WORKSPACE</text>
  <rect x="12" y="164" width="191" height="38" rx="7" fill="#203832"/>
  <rect x="12" y="164" width="3" height="38" rx="1.5" fill="#62E6C2"/>
  <circle cx="34" cy="184" r="5" fill="none" stroke="#62E6C2" stroke-width="1.5"/>
  <circle cx="34" cy="184" r="2" fill="#62E6C2"/>
  <text x="52" y="188" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">配置</text>
  <rect x="28" y="213" width="11" height="8" rx="1.5" fill="none" stroke="#A4B6B5" stroke-width="1.4"/>
  <path d="M31 216h5" stroke="#A4B6B5" stroke-width="1.2" stroke-linecap="round"/>
  <text x="52" y="220" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="12">档案</text>
  <text x="20" y="275" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">SYSTEM</text>
  <circle cx="34" cy="304" r="5.5" fill="none" stroke="#A4B6B5" stroke-width="1.4"/>
  <circle cx="34" cy="304" r="2" fill="#A4B6B5"/>
  <path d="M34 296v2M34 310v2M26 304h2M40 304h2" stroke="#A4B6B5" stroke-width="1.4" stroke-linecap="round"/>
  <text x="52" y="309" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="12">设置</text>
  <line x1="18" y1="710" x2="197" y2="710" stroke="#26363A"/>
  <circle cx="26" cy="738" r="4" fill="#62E6C2"/>
  <text x="40" y="742" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="10">本地配置已同步</text>

  <!-- main content -->
  <text x="252" y="99" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">配置</text>
  <text x="252" y="121" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="12">选择 Codex 当前使用的 Provider 和模型。</text>

  <rect x="252" y="145" width="916" height="118" rx="10" fill="#1A272B" stroke="#3A5153" filter="url(#shadow)"/>
  <circle cx="284" cy="181" r="11" fill="#62E6C2" fill-opacity="0.18" stroke="#62E6C2"/>
  <circle cx="284" cy="181" r="4" fill="#62E6C2"/>
  <text x="309" y="178" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">CPA</text>
  <rect x="357" y="163" width="55" height="22" rx="11" fill="#203832"/>
  <text x="370" y="178" fill="#62E6C2" font-family="Segoe UI, sans-serif" font-size="10" font-weight="650">已激活</text>
  <text x="309" y="201" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="12">gpt-5.6-sol  ·  Responses API</text>
  <text x="309" y="222" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="11">Profile：工作  ·  cpa.example.com/v1</text>
  <rect x="1016" y="177" width="122" height="32" rx="6" fill="#62E6C2"/>
  <text x="1040" y="198" fill="#0E1519" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">重新启动 Codex</text>

  <text x="252" y="307" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="15" font-weight="650">Provider</text>
  <text x="313" y="307" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="11">2 个配置</text>
  <rect x="1071" y="283" width="97" height="30" rx="6" fill="#62E6C2"/>
  <path d="M1090 298h10M1095 293v10" stroke="#0E1519" stroke-width="1.7" stroke-linecap="round"/>
  <text x="1107" y="303" fill="#0E1519" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">添加</text>

  <!-- provider list -->
  <rect x="252" y="328" width="916" height="184" rx="10" fill="#141E23" stroke="#26363A"/>
  <rect x="253" y="329" width="914" height="86" rx="9" fill="#203832"/>
  <circle cx="285" cy="365" r="15" fill="#62E6C2"/>
  <text x="278" y="370" fill="#0E1519" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">C</text>
  <text x="316" y="358" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">CPA</text>
  <text x="316" y="379" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="11">cpa.example.com/v1  ·  Responses API</text>
  <text x="735" y="359" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="11">3 个模型</text>
  <text x="735" y="380" fill="#62E6C2" font-family="Segoe UI, sans-serif" font-size="10">当前使用</text>
  <rect x="1008" y="348" width="61" height="29" rx="6" fill="#2EBB96"/>
  <text x="1021" y="367" fill="#0E1519" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">切换</text>
  <rect x="1080" y="348" width="44" height="29" rx="6" fill="#1A272B" stroke="#3A5153"/>
  <circle cx="1095" cy="362" r="1.5" fill="#A4B6B5"/>
  <circle cx="1101" cy="362" r="1.5" fill="#A4B6B5"/>
  <circle cx="1107" cy="362" r="1.5" fill="#A4B6B5"/>
  <line x1="276" y1="415" x2="1143" y2="415" stroke="#26363A"/>
  <circle cx="285" cy="455" r="15" fill="#2B3A3E" stroke="#3A5153"/>
  <text x="278" y="460" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">O</text>
  <text x="316" y="448" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="13" font-weight="650">OpenAI</text>
  <text x="316" y="469" fill="#A4B6B5" font-family="Segoe UI, sans-serif" font-size="11">api.openai.com/v1  ·  Responses API</text>
  <text x="735" y="458" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="11">2 个模型</text>
  <text x="1009" y="458" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="10">未激活</text>
  <rect x="1080" y="442" width="44" height="29" rx="6" fill="#1A272B" stroke="#3A5153"/>
  <circle cx="1095" cy="456" r="1.5" fill="#A4B6B5"/>
  <circle cx="1101" cy="456" r="1.5" fill="#A4B6B5"/>
  <circle cx="1107" cy="456" r="1.5" fill="#A4B6B5"/>

  <text x="252" y="570" fill="#E7F0EE" font-family="Segoe UI, sans-serif" font-size="14" font-weight="650">最近操作</text>
  <text x="252" y="596" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="11">已激活 CPA / gpt-5.6-sol</text>
  <text x="252" y="618" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="11">配置写入前已自动保留备份</text>
  <line x1="252" y1="650" x2="1168" y2="650" stroke="#26363A"/>
  <text x="252" y="680" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="10">Proxy Switch  ·  Windows V1</text>
  <text x="1057" y="680" fill="#6D8181" font-family="Segoe UI, sans-serif" font-size="10">本地运行</text>
</svg>
