name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          go-version: '1.25.x'
          cache: true

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate tag and release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = ./scripts/ci/validate-release.ps1 -Tag $env:RELEASE_TAG
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run model-independent release verification and build
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/ci/verify.ps1 -BuildWindows

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $signTool = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin/*/x64/signtool.exe') |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe is missing' }
          $nsis, $signTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Detect signing configuration
        id: signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $signed = -not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $signed) {
            Write-Warning 'WINDOWS_CERTIFICATE_BASE64 is not configured: producing an unsigned release artifact.'
          }

      - name: Restore signing certificate
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'codex-provider-hub.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign executable and NSIS installer
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        env:
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WAILS_WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WAILS_WINDOWS_CERT_PASSWORD)) {
            throw 'WAILS_WINDOWS_CERT_PASSWORD is required when a signing certificate is configured'
          }
          wails3 task windows:sign:installer ARCH=amd64 INSTALL_SCOPE=user SIGN_CERTIFICATE="$env:CERTIFICATE_PATH"

      - name: Build unsigned NSIS installer
        if: steps.signing.outputs.signed != 'true'
        shell: pwsh
        run: wails3 task windows:create:nsis:installer INSTALL_SCOPE=user

      - name: Verify Authenticode signatures
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          foreach ($path in @('bin/codex-provider-hub.exe', 'bin/codex-provider-hub-amd64-installer.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "Missing valid timestamped signature: $path"
            }
          }

      - name: Rebuild portable ZIP from release executable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build/windows/portable/package.ps1

      - name: Rename release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem bin -Filter '*-amd64-installer.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not created' }
          $installerName = "CodexProviderHub-$env:VERSION-Setup.exe"
          Copy-Item $installer.FullName (Join-Path $installer.DirectoryName $installerName) -Force
          $portable = Join-Path (Get-Location) 'bin\codex-provider-hub-windows-amd64.zip'
          if (-not (Test-Path $portable)) { throw 'Portable ZIP was not created' }
          Copy-Item $portable (Join-Path (Get-Location) "bin\CodexProviderHub-$env:VERSION-portable.zip") -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(
            "bin\CodexProviderHub-$env:VERSION-Setup.exe",
            "bin\CodexProviderHub-$env:VERSION-portable.zip"
          )
          Get-FileHash $files -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content "bin\SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG `
            --verify-tag `
            --title "Codex Provider Hub $env:VERSION" `
            --generate-notes `
            "bin\CodexProviderHub-$env:VERSION-Setup.exe" `
            "bin\CodexProviderHub-$env:VERSION-portable.zip" `
            "bin\SHA256SUMS.txt"

      - name: Remove temporary signing certificate
        if: always()
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'codex-provider-hub.pfx'
          if (Test-Path -LiteralPath $certificate) {
            Remove-Item -LiteralPath $certificate -Force
          }
